name: Offline verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          enable-cache: false
      - run: uv sync --locked
      - name: Offline checks
        env:
          OPENAI_API_KEY: ''
          OPENAI_MODEL: ''
          OPENAI_SCHEMA_MODEL: ''
          UV_OFFLINE: '1'
          PYTHONPATH: ${{ github.workspace }}/.ci/offline_guard
        run: |
          unset OPENAI_API_KEY OPENAI_MODEL OPENAI_SCHEMA_MODEL
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          uv run --locked pytest -q
          uv run --locked sovtrace --help
          uv run --locked sovtrace --version
          uv run --locked python scripts/demo.py
          uv run --locked python scripts/demo.py --format json
          uv run --locked python scripts/case_study_demo.py
          uv run --locked python scripts/verify_synthetic.py --offline
