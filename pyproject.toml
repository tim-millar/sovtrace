[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovtrace"
version = "0.1.0"
description = "SOVTrace: bounded insurance Schedule of Values queries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "sqlglot>=30,<31",
]

[project.scripts]
sovtrace = "sovtrace.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright[nodejs]",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
